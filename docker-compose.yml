services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: autorental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: autorental_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autorental_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autorental_network

  # ==========================================
  # 2. Back-end API Service (NestJS)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autorental_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/autorental_db?schema=public"
      JWT_SECRET: "super_secret_jwt_key_nhom04_2026"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autorental_network

  # ==========================================
  # 3. Front-end Web Service (Next.js 16)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autorental_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5001/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - autorental_network

# ==========================================
# Volumes & Networks
# ==========================================
volumes:
  postgres_data:
    driver: local

networks:
  autorental_network:
    driver: bridge
